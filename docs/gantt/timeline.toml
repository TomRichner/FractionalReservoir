# Data for the final-draft timeline (docs/gantt/plan_timeline.html).
# Read docs/gantt/Plan_Timeline.md before editing. Build the page with
#   uv run python build_timeline.py
# from this folder.
#
# Every [[task]]:
#   id        task code <stage>_<step>_<kind>[n]  (see Plan_Timeline.md);
#             kind P = Plan, B = Build, T = Test, U = User (waits on Tom:
#             his decision, review or a conversation before work proceeds)
#   block     A, B, C or D           group   row group heading within the block
#   name      short name for the label column (at most 44 characters)
#   who       lead | fable | opus | workers | tom | lead+tom
#   worker    optional, the worker agent's name (matlab-fable-1, ...)
#   issue     optional, FD-0xx
#   status    done | running | planned | tom   (tom = waiting on Tom / Tom's own)
#   what      one or two plain sentences: what the step does and why
#   gate      how it is checked
#   depends   list of task codes it waits for
#   estimate  working estimate in minutes, a multiple of 15 (required unless done);
#             corrected freely while the task has not started
#   guess     true when the estimate is a guess rather than the lead's figure
#   estimate_of_record         minutes; the estimate FROZEN when the task started.
#   estimate_of_record_text    optional, as it was stated ("2.5 to 3 h")
#   estimate_of_record_source  where it was recorded before the task ran
#             Never filled in after the fact, never edited once set.
#   start, end   actual times (required for done; start required for running)
#   took_min  done only: measured minutes, end - start (checked against them)
#   rule      done only: which rule gave start and end (see Plan_Timeline.md)
#   approx_start true when the start is inferred, not recorded
#   source    for tasks not done: where the start or estimate comes from
#   merge     the merge commit into main, when merged
#   commits   the branch's commits
#   note      anything else for the hover box

